name: Tutornow
description: Tutornow (tutornow.it) is an Italian online tutoring platform ("ripetizioni") that connects
  students from elementary school through university with qualified tutors across 150+ subjects, including
  math, physics, chemistry, and languages. It offers individual and group online lessons starting around
  €15/hour, homework help, exam and university preparation, academic-recovery programs, and specialized
  support for students with learning differences (DSA/BES), with 250,000+ lesson hours delivered and 20,000+
  tutors across major Italian cities. Tutornow is a consumer (B2C) education service and publishes no public
  developer API, API documentation, or developer portal — this profile is maintained as a company record in
  the API Evangelist network.
